<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Black Hole Simulation</title>
  <defs>
    <!-- Everything outside the central circle of 80 % diameter is the plain theme colour, so a
         launcher's mask of any shape can crop it. -->
    <radialGradient id="space" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="204">
      <stop offset="0" stop-color="#18223d"/>
      <stop offset="0.55" stop-color="#0a0e19"/>
      <stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <!-- Doppler beaming: the approaching left side is brighter and bluer than the receding right. -->
    <linearGradient id="doppler" x1="56" y1="0" x2="456" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.2" stop-color="#ffe6b5"/>
      <stop offset="0.48" stop-color="#ffb44d"/>
      <stop offset="0.76" stop-color="#e5682a"/>
      <stop offset="1" stop-color="#8a2e0c"/>
    </linearGradient>
    <linearGradient id="ring" x1="178" y1="0" x2="334" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffe9c4"/>
      <stop offset="1" stop-color="#ffb44d"/>
    </linearGradient>
    <!-- The disk is brightest at its inner edge and fades out towards the outer edge. -->
    <radialGradient id="disk-fade" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="200"
      gradientTransform="translate(0 196.1) scale(1 0.234)">
      <stop offset="0.49" stop-color="#fff"/>
      <stop offset="0.78" stop-color="#d8d8d8"/>
      <stop offset="1" stop-color="#262626"/>
    </radialGradient>
    <radialGradient id="arch-fade" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="122">
      <stop offset="0.8" stop-color="#fff"/>
      <stop offset="1" stop-color="#666"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb44d" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff9a4d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <mask id="disk-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="url(#disk-fade)"/>
    </mask>
    <mask id="arch-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="url(#arch-fade)"/>
    </mask>
    <clipPath id="safe"><circle cx="256" cy="256" r="203"/></clipPath>
    <clipPath id="far"><rect width="512" height="256"/></clipPath>
    <clipPath id="near"><rect y="256" width="512" height="256"/></clipPath>
    <filter id="blur" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <!-- The disk seen at about 77 degrees: outer edge 200 x 46, inner edge 98 x 23. -->
    <path id="annulus" fill-rule="evenodd"
      d="M56 256a200 46 0 1 0 400 0a200 46 0 1 0 -400 0Z M158 256a98 23 0 1 1 196 0a98 23 0 1 1 -196 0Z"/>
    <!-- Flow streaks between the edges. -->
    <g id="streaks" fill="none" stroke-width="1.6">
      <ellipse cx="256" cy="256" rx="118" ry="27.6" stroke="#fff" opacity="0.55"/>
      <ellipse cx="256" cy="256" rx="136" ry="31.8" stroke="#fff3dc" opacity="0.35"/>
      <ellipse cx="256" cy="256" rx="152" ry="35.6" stroke="#7a2a0c" opacity="0.35"/>
      <ellipse cx="256" cy="256" rx="168" ry="39.3" stroke="#fff3dc" opacity="0.22"/>
      <ellipse cx="256" cy="256" rx="184" ry="43" stroke="#7a2a0c" opacity="0.3"/>
    </g>
    <!-- The far side of the disk, lensed over the top of the hole. -->
    <path id="arch" d="M138 270V256a118 122 0 0 1 236 0V270H343V256a87 91 0 0 0 -174 0V270Z"/>
    <!-- Its fainter second image under the hole. -->
    <path id="underarc" d="M171 256a85 88 0 0 0 170 0h-5a80 83 0 0 1 -160 0Z"/>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#space)"/>
  <g fill="#d6e8ff">
    <circle cx="150" cy="118" r="2.6" opacity="0.85"/>
    <circle cx="372" cy="108" r="2" opacity="0.6"/>
    <circle cx="420" cy="190" r="1.6" opacity="0.5"/>
    <circle cx="96" cy="330" r="1.8" opacity="0.55"/>
    <circle cx="330" cy="420" r="2.4" opacity="0.7"/>
    <circle cx="200" cy="438" r="1.4" opacity="0.45"/>
    <circle cx="256" cy="74" r="1.4" opacity="0.45"/>
    <circle cx="412" cy="360" r="1.2" opacity="0.4"/>
    <circle cx="118" cy="176" r="1.1" opacity="0.4"/>
  </g>

  <g clip-path="url(#safe)">
  <g transform="translate(256 256) scale(0.93) translate(-256 -256)">
  <!-- Glow of the disk and the arch; the shadow covers its middle. -->
  <ellipse cx="256" cy="250" rx="214" ry="84" fill="url(#glow)"/>
  <g filter="url(#blur)" opacity="0.7">
    <use href="#annulus" fill="url(#doppler)" mask="url(#disk-mask)"/>
    <use href="#arch" fill="url(#doppler)"/>
  </g>

  <!-- Lensed starlight, behind the disk. -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#7cc4ff" stroke-width="2" opacity="0.45"/>

  <!-- Far half of the disk, behind the hole. -->
  <g clip-path="url(#far)" mask="url(#disk-mask)" opacity="0.92">
    <use href="#annulus" fill="url(#doppler)"/>
    <use href="#streaks"/>
  </g>

  <g mask="url(#arch-mask)">
    <use href="#arch" fill="url(#doppler)"/>
    <path fill="none" stroke="#fff" stroke-width="1.6" opacity="0.35" d="M152 256a104 108 0 0 1 208 0"/>
  </g>
  <use href="#underarc" fill="url(#doppler)" opacity="0.6"/>

  <!-- The shadow and the photon ring at its edge. -->
  <circle cx="256" cy="256" r="74" fill="#000"/>
  <circle cx="256" cy="256" r="76.5" fill="none" stroke="url(#ring)" stroke-width="4"/>

  <!-- Near half of the disk, in front of the hole, with its white-hot inner edge. -->
  <g clip-path="url(#near)" mask="url(#disk-mask)">
    <use href="#annulus" fill="url(#doppler)"/>
    <use href="#streaks"/>
    <ellipse cx="256" cy="256" rx="99" ry="23.5" fill="none" stroke="#fff" stroke-width="3"
      opacity="0.85"/>
  </g>
  </g>
  </g>
</svg>
