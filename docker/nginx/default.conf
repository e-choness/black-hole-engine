server_tokens off;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json
               application/wasm image/svg+xml;

    # add_header is not inherited by blocks that declare their own, so every location
    # includes the shared security headers next to its Cache-Control policy. Cache-Control
    # omits "always" so error responses (such as a 404 under /assets/) are never cached.

    # Vite emits content-hashed file names under /assets/.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # The browser looks for a new service worker on every visit, and a cache in between must not
    # hold back that check; the workbox-[hash].js it imports is content-hashed.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location ~ /\. {
        include /etc/nginx/snippets/security-headers.conf;
        deny all;
    }

    # docs/LEGAL.md is shown as plain text instead of being offered as a download.
    location ~* \.md$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        types { }
        default_type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    # Unhashed files copied from public/ (textures, icons).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }
}
