name: CI

# The README, its images, the itch.io page art and the Dependabot configuration are not part of
# the site, so changes to only those start no run. The weekly run takes the whole e2e suite and
# the deprecation check even when nothing was pushed.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - .github/readme/**
      - .github/itch/**
      - .github/dependabot.yml
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - .github/readme/**
      - .github/itch/**
      - .github/dependabot.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Grouped by event as well, so a push to main never queues behind a weekly or manual run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  verify:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lint and unit tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          outputs: type=cacheonly
          provenance: false
          sbom: false
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

      - name: Build static site
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dist
          outputs: type=local,dest=dist
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=test
            type=gha,scope=dist
          cache-to: type=gha,scope=dist,mode=max

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          outputs: type=cacheonly
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=dist
            type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  # Every frame is drawn on the CPU, so the whole suite outlasts one job's time limit. A push to
  # main runs only the tests tagged @smoke, and the deploy waits for them; pull requests, the
  # weekly run and manual runs split the whole suite across four jobs.
  e2e:
    name: End-to-end tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'push' && '["smoke"]' || '["shard-1", "shard-2", "shard-3", "shard-4"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Playwright image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: e2e
          load: true
          tags: black-hole-e2e:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=e2e
          # The first job of the matrix writes the cache for all of them.
          cache-to: ${{ strategy.job-index == 0 && 'type=gha,scope=e2e,mode=max' || '' }}

      # The image runs as uid 1000 and the runner as uid 1001, so the bind-mounted output
      # directories must be writable by both.
      - name: Run Playwright
        env:
          PART: ${{ matrix.part }}
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          if [ "$PART" = smoke ]; then
            selection=(--grep @smoke)
          else
            selection=(--shard="$((INDEX + 1))/$TOTAL")
          fi
          install -d -m 0777 .cache/screenshots .cache/playwright
          docker run --rm --init --shm-size=1g --env CI=true \
            --volume "$PWD/.cache/screenshots:/app/.cache/screenshots" \
            --volume "$PWD/.cache/playwright:/app/.cache/playwright" \
            black-hole-e2e:ci npx playwright test "${selection[@]}"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.part }}
          path: .cache/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.part }}
          path: .cache/playwright/
          if-no-files-found: warn
          retention-days: 14

  # A package can be deprecated after it was locked, so this builds uncached on every run. The
  # deploy does not wait for it, so a newly deprecated package is reported without blocking a
  # release.
  deprecations:
    name: Deprecated packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check the lockfile against the npm registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: deprecations
          outputs: type=cacheonly
          no-cache-filters: deprecations
          provenance: false
          sbom: false

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Pushes the files deployed to GitHub Pages, without source maps, to an itch.io channel. butler
  # uploads only what changed since the last build and skips the push when nothing did. The page
  # must be of kind HTML with the channel marked as played in the browser, which only the itch.io
  # edit page can set.
  itch:
    name: Publish to itch.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: itch-io
      cancel-in-progress: false
    environment:
      name: itch-io
      url: https://echoness.itch.io/black-hole
    env:
      ITCH_TARGET: echoness/black-hole:html5
      # broth publishes no checksums, so the digest is of the archive as first downloaded.
      BUTLER_VERSION: 15.32.0
      BUTLER_SHA256: 2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5
    steps:
      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Install butler
        run: |
          archive="$RUNNER_TEMP/butler.zip"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://broth.itch.zone/butler/linux-amd64/$BUTLER_VERSION/archive.zip"
          echo "$BUTLER_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          site="$RUNNER_TEMP/site"
          mkdir "$site"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$site"
          butler push "$site" "$ITCH_TARGET" --ignore '*.map' --if-changed \
            --userversion "${GITHUB_SHA::7}"
